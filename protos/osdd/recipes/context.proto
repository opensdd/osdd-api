syntax = "proto3";

package osdd.recipes.context;

option go_package = "github.com/opensdd/osdd-api/clients/go/osdd/recipes";

import "osdd/common.proto";

message Context {
  repeated ContextEntry entries = 1;
}

message ContextEntry {
  string path = 1;
  ContextFrom from = 2;
  optional common.EntryFilter filter = 3;
}

message ContextFrom {
  oneof type {
    CombinedContextSource combined = 100;
    common.GitReference github = 101;
    common.Exec cmd = 102;
    string text = 103;
    string prefetch_id = 104;
    UserInputContextSource user_input = 105;
    // Local file should be mostly used for tests. If the provided path is relative, then it will be relative to the
    // current working directory.
    string local_file = 106;
  }
}

message CombinedContextSource {
  repeated Item items = 1;

  message Item {
    oneof type {
      common.GitReference github = 100;
      common.Exec cmd = 101;
      string text = 102;
      string prefetch_id = 103;
      UserInputContextSource user_input = 104;
      // Local file should be mostly used for tests. If the provided path is relative, then it will be relative to the
      // current working directory.
      string local_file = 105;
    }
  }
}

message UserInputContextSource {
  repeated common.UserInputParameter entries = 1;
}
